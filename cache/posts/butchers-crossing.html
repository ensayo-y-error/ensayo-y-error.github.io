<p>Butcher's Crossing es una novela escrita por el estadounidense John Williams. La historia sigue a Will Andrews, un joven idealista de Harvard que en la década de 1870 abandona sus estudios y viaja al pueblo fronterizo de Butcher's Crossing, Kansas, en busca de aventura y conexión con la naturaleza.</p>
